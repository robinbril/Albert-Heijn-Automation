name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # stable, not a pin: a pinned minor keeps passing on a toolchain that
          # still carries the standard-library advisories govulncheck reports.
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # stable, not a pin: a pinned minor keeps passing on a toolchain that
          # still carries the standard-library advisories govulncheck reports.
          go-version: stable
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
